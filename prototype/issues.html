<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Issues - DataClawHub</title>
  <meta name="description" content="DataClawHub 社区议题：提出物流 AI 产品建议、技术问题与协作议题，推动平台持续完善。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=DM+Serif+Display&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body data-page="issues">
  <!-- 顶部导航栏（由 app.js 渲染） -->
  <header id="navbar"></header>

  <main class="main">
    <div class="container">
      <!-- 面包屑导航 -->
      <nav class="breadcrumb" aria-label="面包屑">
        <a href="index.html">首页</a>
        <span class="sep">/</span>
        <span class="current">Issues</span>
      </nav>

      <!-- 标题区 -->
      <div class="sectionHeader" style="margin-top:8px">
        <div>
          <h2 class="sectionTitle" style="font-size:36px">Issues</h2>
          <p class="sectionDesc">提出物流 AI 产品建议、技术问题和协作议题，与社区共同推动平台能力持续完善。</p>
        </div>
        <a class="btn btnPrimary" id="newIssueBtn" href="#" onclick="return false;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
          发起议题
        </a>
      </div>

      <!-- 状态筛选 + 计数 -->
      <div class="filterRow" style="margin-bottom:16px">
        <span class="filterLabel">状态</span>
        <div class="filterTabs" id="issueTabs">
          <button class="filterTab active" data-status="全部">全部</button>
          <button class="filterTab" data-status="开放">开放</button>
          <button class="filterTab" data-status="已关闭">已关闭</button>
        </div>
        <span class="issueCount" id="issueCount" style="margin-left:auto">共 4 个</span>
      </div>

      <!-- 议题列表（由 app.js 渲染） -->
      <div class="issueList" id="issuesList"></div>
    </div>
  </main>

  <!-- 页脚（由 app.js 渲染） -->
  <footer id="footer"></footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
