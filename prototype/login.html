<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 - DataClawHub</title>
  <meta name="description" content="登录 DataClawHub 物流 AI 协作社区。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=DM+Serif+Display&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body data-page="login">
  <div class="loginPage">
    <!-- 左侧品牌视觉 -->
    <div class="loginVisual">
      <div class="loginVisualInner">
        <span class="heroBadge" style="background:rgba(255,255,255,0.12);color:#fff;margin-bottom:24px">物流 AI · 开源协作社区</span>
        <h1 class="loginVisualTitle">让每一次<br />协作都产生价值</h1>
        <p class="loginVisualDesc">
          登录后即可下载制品、发布任务、参与竞赛，与全球物流 AI 开发者共同构建开放的行业生态。
        </p>
      </div>
    </div>

    <!-- 右侧表单 -->
    <div class="loginFormSide">
      <div class="loginCard">
        <h2 class="loginTitle">欢迎回来</h2>
        <p class="loginSub">登录你的 DataClawHub 账户</p>

        <!-- 登录模式切换 -->
        <div class="loginTabs">
          <button class="loginTab active" data-mode="classic">经典登录</button>
          <button class="loginTab" data-mode="terminal">Terminal</button>
        </div>

        <!-- 经典登录表单 -->
        <div id="classicForm">
          <div class="formField">
            <label for="username">用户名 / 邮箱</label>
            <input type="text" id="username" placeholder="请输入用户名或邮箱" />
          </div>
          <div class="formField">
            <label for="password">密码</label>
            <input type="password" id="password" placeholder="请输入密码" />
          </div>
          <div class="formRow">
            <label class="checkBox">
              <input type="checkbox" /> 记住我
            </label>
            <a href="#">忘记密码？</a>
          </div>
          <button class="loginBtn" id="loginBtn">登录</button>

          <div class="loginDivider">或使用以下方式登录</div>

          <div class="ssoBtns">
            <button class="ssoBtn" onclick="showToast('GitHub 登录（原型演示）','success');return false;">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56 0-.27-.01-1.17-.02-2.12-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.03 1.76 2.7 1.25 3.35.96.1-.75.4-1.25.72-1.54-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.28 1.18-3.09-.12-.29-.51-1.46.11-3.04 0 0 .96-.31 3.15 1.18a10.9 10.9 0 0 1 5.74 0c2.19-1.49 3.15-1.18 3.15-1.18.62 1.58.23 2.75.11 3.04.73.81 1.18 1.83 1.18 3.09 0 4.41-2.69 5.38-5.25 5.66.41.35.77 1.05.77 2.12 0 1.53-.01 2.76-.01 3.14 0 .31.21.67.8.56A11.52 11.52 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/></svg>
              GitHub
            </button>
            <button class="ssoBtn" onclick="showToast('微信登录（原型演示）','success');return false;">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M9.5 4C5.36 4 2 6.69 2 10c0 1.9 1.05 3.6 2.7 4.7l-.7 2.1 2.4-1.2c.7.2 1.4.3 2.1.3.1 0 .2 0 .3 0-.1-.4-.2-.8-.2-1.2 0-3.1 3-5.7 6.7-5.7.2 0 .4 0 .7.1C15.2 6.1 12.6 4 9.5 4zM6.5 8.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm5 0a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"/><path d="M22 14.5c0-2.5-2.4-4.5-5.3-4.5s-5.3 2-5.3 4.5 2.4 4.5 5.3 4.5c.5 0 1-.1 1.5-.2l2 .8-.5-1.6c1.4-.8 2.3-2.1 2.3-3.5zm-7-1a.9.9 0 1 1 0-1.8.9.9 0 0 1 0 1.8zm4 0a.9.9 0 1 1 0-1.8.9.9 0 0 1 0 1.8z"/></svg>
              微信
            </button>
          </div>

          <p style="text-align:center;margin-top:20px;font-size:13px;color:var(--textSecondary)">
            还没有账户？<a href="#" style="color:var(--primary);font-weight:600">立即注册</a>
          </p>
        </div>

        <!-- Terminal 终端登录面板（默认隐藏） -->
        <div class="terminalPanel" id="terminalPanel" style="display:none">
          <div class="terminalBar">
            <span class="terminalDot r"></span>
            <span class="terminalDot y"></span>
            <span class="terminalDot g"></span>
            <span class="terminalTitle">dataclawhub — terminal login</span>
          </div>
          <div class="terminalBody">
            <div class="terminalLine"><span class="prompt">$</span> <span class="cmd">dch login</span></div>
            <div class="terminalLine"><span class="out">正在连接 DataClawHub 认证服务…</span></div>
            <div class="terminalLine"><span class="out">Username:</span> <span class="hl">user@dataclawhub.com</span></div>
            <div class="terminalLine"><span class="out">Password:</span> <span class="hl">••••••••</span></div>
            <div class="terminalLine"><span class="out">验证通过 ✓ 欢迎回来，</span><span class="hl">开发者</span><span class="terminalCaret"></span></div>
            <div class="terminalLine" style="margin-top:12px"><span class="out">提示：此模式为终端风格的经典登录，功能与左侧一致。</span></div>
          </div>
          <div style="padding:16px 24px;border-top:1px solid #3a2a1e">
            <button class="btn btnPrimary" style="width:100%" onclick="showToast('登录成功，欢迎回来（原型演示）','success');setTimeout(()=>location.href='index.html',800);return false;">确认登录</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
